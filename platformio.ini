; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` without -e only builds the firmware env — env:native is for
; host tests (test/run_host_tests.sh calls g++ directly; src/ needs ESP-IDF).
[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; CH340 on the ESP32-CAM-MB: pyserial's default DTR+RTS (both asserted)
; holds EN/GPIO0. Monitor open = chip held still, empty UART, absent from
; LAN. 0 = released. Manual reset (or an RTS pulse) after the monitor
; attaches to see the boot log; setup() prints only once, then loop()
; deletes itself.
monitor_rts = 0
monitor_dtr = 0
board_build.filesystem = littlefs
; `pio run -t upload` forces LDF off when combined with other targets ->
; all -I lib/* are lost and compilation fails. Explicit chain + run targets
; separately.
lib_ldf_mode = chain
; Drop RainMaker/Insights components — the hybrid compile would need
; their embedded certs; we don't use them. Don't drop
; espressif/esp32-camera.
custom_component_remove =
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/cbor
	espressif/esp_rainmaker
	espressif/rmaker_common
	chmorgan/esp-libhelix-mp3
	espressif/esp_hosted
	espressif/esp_wifi_remote
	espressif/esp-modbus
	espressif/esp_modem
	espressif/esp-dsp
	espressif/qrcode
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    ; include/ doesn't automatically reach lib TUs' include path — an
    ; explicit -I is needed so the optional include/secret.h is visible from
    ; lib/.
    -I include

; Host tests for pure domain code (llmproto etc.) — no ESP-IDF.
; Used via test/run_host_tests.sh (direct g++), not `pio test`.
[env:native]
platform = native
test_build_src = false
build_flags =
    -std=gnu++17
    -Wall -Wextra
